[workspace]
authors = ["adiezsanchez <adiez.biotech@gmail.com>"]
channels = ["conda-forge"]
name = "workshop_3D_segmentation"
platforms = ["linux-64", "osx-arm64", "osx-64", "win-64"]
version = "0.1.0"

# -------------------------
# Tasks
# -------------------------

[tasks.lab]
cmd = "jupyter lab"

[tasks.napari]
cmd = "napari"

# Register a Jupyter kernelspec so Cursor/VS Code can attach without broken Pixi activation
[tasks.install-kernel]
cmd = "python -m ipykernel install --user --name workshop_3D_segmentation --display-name \"Python (pixi: workshop_3D_segmentation)\""

# Owner-only: refresh S3 presigned URL, commit, and push data_url.json
[tasks.generate_link]
cmd = "python scripts/generate_link.py"

# Workshop users: sync-check committed URL, then download and extract raw data
[tasks.data_download]
cmd = "python scripts/data_download.py"

# Install env, then run data_download twice
[tasks.workshop]
cmd = "pixi install && pixi run data_download && pixi run lab"

# -------------------------
# Cross-platform dependencies
# -------------------------

[dependencies]
python = "3.10.*" # keep Python compatible with all plugins
cellpose = "==3.1.1.3" # CellposeV3 (lighter older version compared to the ViT implementation)
apoc-backend = "*" # fast GPU classifiers (APOC)
boto3 = "*" # AWS S3 client (presigned URLs)
edt = "*" # Euclidean distance transforms
ipykernel = "*" # Jupyter kernel support
ipython = "*" # interactive shell
jupyterlab = "*" # Jupyter environment
napari = ">=0.6,<0.8" # avoid old 0.4.x runtime-incompatible build
nbformat = "*" # notebook parsing
czifile = "*" # Zeiss CZI file reader
plotly = "*" # plotting library
pyclesperanto-prototype = "*" # GPU image processing (OpenCL)
pyqt = "*" # GUI backend for napari
requests = "*" # HTTP downloads for data_download
setuptools = "<81" # pin to avoid pkg_resources removal
seaborn = ">=0.13.2,<0.14"
tqdm = "*" # download progress bars

# -------------------------
# Platform-specific deps
# -------------------------

[target.linux-64.dependencies]
ocl-icd-system = "*"   # NVIDIA/Intel GPU when the driver is installed
pocl = "*"             # CPU OpenCL when it is not

[target.osx-arm64.dependencies]
pocl = "*"             # replaces ocl_icd_wrapper_apple

[target.osx-64.dependencies]
pocl = "*"             # Intel Macs are in platforms and currently have no OpenCL dep